- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/diffbot/cmd_vel"        # gz-default scoped name (DiffDrive, no <topic> override); confirm: gz topic -l
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/model/diffbot/odometry"       # gz-default scoped name (DiffDrive, no <topic> override); confirm: gz topic -l
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "/scan"                          # confirm — sensor <topic>scan</topic>; may be /scan or scoped
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/model/diffbot/tf"             # gz-default scoped name (DiffDrive, no <topic> override); confirm: gz topic -l
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# NOTE: Gazebo create/remove are gz-transport *services*. ros_gz_bridge's
# parameter_bridge only bridges topics on this release (its config parser
# rejects service entries: "both ros_type_name and gz_type_name must be
# set"), so scene_spawner calls `/world/<world>/create` and `/remove`
# directly via the `gz service` CLI instead of through this bridge.
